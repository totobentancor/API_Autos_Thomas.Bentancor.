<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Automóvil</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/alta.js" defer></script>
</head>
<body>

    <header>
        <h1>Sistema de Automóviles</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="consulta.html">Consultar</a>
        <a href="alta.html">Agregar</a>
        <a href="modificar.html">Modificar</a>
        <a href="eliminar.html">Eliminar</a>
    </nav>

    <main>
        <h2>Agregar automóvil</h2>

        <form id="formAlta">
            <label for="id">ID (opcional):</label>
            <input type="number" id="id" min="1">

            <label for="marca">Marca:</label>
            <input type="text" id="marca" required>

            <label for="precio">Precio:</label>
            <input type="number" id="precio" min="1" required>

            <label for="color">Color:</label>
            <input type="color" id="color" value="#000000" required>

            <button type="submit">Agregar</button>
        </form>

        <div id="mensajeAlta"></div>
    </main>

</body>
</html>
