<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Automóvil</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/modificar.js" defer></script>
</head>
<body>

    <header>
        <h1>Sistema de Automóviles</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="consulta.html">Consultar</a>
        <a href="alta.html">Agregar</a>
        <a href="modificar.html">Modificar</a>
        <a href="eliminar.html">Eliminar</a>
    </nav>

    <main>
        <h2>Buscar automóvil a modificar</h2>

        <form id="formBuscar">
            <label for="idBuscar">ID:</label>
            <input type="number" id="idBuscar" min="1" required>
            <button type="submit">Buscar</button>
            <button type="button" id="btnCancelar">Limpiar Búsqueda</button>
        </form>

        <div id="mensajeBusqueda"></div>

        <h2>Datos del automóvil</h2>

        <form id="formModificar" style="display:none;">
            <label for="idAuto">ID (no se puede modificar):</label>
            <input type="number" id="idAuto" disabled>

            <label for="marca">Marca:</label>
            <input type="text" id="marca" required>

            <label for="precio">Precio:</label>
            <input type="number" id="precio" min="1" required>

            <label for="color">Color:</label>
            <input type="color" id="color" required>

            <button type="submit">Guardar cambios</button>
            <button type="button" id="btnLimpiarBusqueda">Limpiar Campos</button>
        </form>

        <div id="mensajeModificar"></div>
    </main>

</body>
</html>
